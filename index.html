<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SkiRou</title>
  <meta name="theme-color" content="#f7f3f0">
  <meta name="description" content="Skincare-Routine und Inventar als PWA">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>SkiRou</h2>
      <p class="lock-hint">Code eingeben</p>
      <input id="lock-input" class="lock-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
      <p id="lock-error" class="lock-error" hidden>Falscher Code</p>
      <button id="lock-submit" class="lock-submit">Entsperren</button>
    </div>
  </div>
  <script>
    // Verhindert ein kurzes Aufblitzen der Sperre, wenn bereits entsperrt.
    try {
      if (localStorage.getItem("skirou.unlocked") === "1") {
        document.getElementById("lock-screen").hidden = true;
      }
    } catch (e) {}
  </script>

  <div class="app">
    <header class="app-header">
      <h1>SkiRou</h1>
      <span id="offline-badge" class="offline-badge" hidden>Offline</span>
    </header>

    <nav class="tabs" role="tablist" aria-label="Ansicht">
      <button id="tab-routine" class="tab active" role="tab" aria-selected="true" aria-controls="view-routine">Routine</button>
      <button id="tab-inventar" class="tab" role="tab" aria-selected="false" aria-controls="view-inventar">Inventar</button>
    </nav>

    <main id="view-routine" class="view" role="tabpanel">
      <div class="set-row">
        <label for="set-select" class="sr-only">Routine-Set</label>
        <select id="set-select" class="set-select"></select>
      </div>

      <div id="day-row" class="day-row"></div>

      <div class="time-row">
        <button id="btn-morgen" class="time-btn active" data-time="morgen">☀️ Morgen</button>
        <button id="btn-abend" class="time-btn" data-time="abend">🌙 Abend</button>
      </div>

      <div id="step-list" class="step-list"></div>
      <p id="empty-routine" class="empty-hint" hidden>Für diesen Tag ist noch keine Routine hinterlegt.</p>

      <section id="adhoc-section" class="adhoc-section" hidden>
        <h2 class="adhoc-title">Bei Bedarf</h2>
        <div id="adhoc-list" class="step-list"></div>
      </section>
    </main>

    <main id="view-inventar" class="view" hidden role="tabpanel">
      <div class="search-row">
        <input id="inv-search" type="search" placeholder="Produkt oder Marke suchen" autocomplete="off">
      </div>
      <p id="inv-status" class="inv-status"></p>
      <div id="inv-list" class="inv-list"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="js/routines.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
